name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, mbstring, xml, curl, zip, pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP Lint
        run: find src -name "*.php" -exec php -l {} \;

      - name: Code Style (PHP CS Fixer)
        run: composer cs

      - name: Static Analysis (PHPStan)
        # Run PHPStan against phpstan.neon rather than `composer lint`, whose
        # `analyse src` argument overrides the configured paths and would skip
        # the front controller in public/.
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run Unit Tests
        run: ./vendor/bin/phpunit -c phpunit.xml.dist --testsuite=Unit --no-coverage

      - name: Run Integration Tests
        run: ./vendor/bin/phpunit -c phpunit.xml.dist --testsuite=Integration --no-coverage
        env:
          MONGODB_URL: mongodb://localhost:27017
          APP_ENV: test
          APP_DEBUG: true
          APP_VERSION: "1.0.0-test"

      - name: Code Coverage
        run: php -d pcov.enabled=1 ./vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover coverage/coverage.xml --coverage-text

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  web:
    # The served dashboard bundle (web/dist) is committed, so a broken React tree
    # can ship without any PHP test noticing. Typecheck, lint and build it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer Validate
        run: composer validate --strict
