name: Publish to HiyoriDB

# Trigger on version tags (e.g., v1.0.0, publish-2026-10-14) or manual dispatch
on:
  workflow_dispatch:
  push:
    tags:
      - 'publish-*'
      - 'v*.*.*'

# Required permissions for the GITHUB_TOKEN to push to HiyoriDB repo
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Use a dedicated MongoDB service (or connect to external via MONGODB_URL secret)
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The service below is an EMPTY MongoDB, so a publish from CI has no
      # source data to combine and would produce an empty dump. The release gate
      # catches that (an empty collection fails `combine:dupes`), but the useful
      # answer is to point MONGODB_URL at a populated instance — a restore of the
      # published dump, for example. Until then, cut releases from a machine
      # that holds the ingested data.
      MONGODB_URL: ${{ secrets.MONGODB_URL || 'mongodb://localhost:27017' }}
      APP_ENV: prod
      APP_DEBUG: false
      # These must be set as repository secrets in Hiyori-API/hiyori-cli:
      # HIYORI_DB_TOKEN: fine-grained PAT with Contents:Read/Write on Hiyori-API/HiyoriDB
      #                  (falls back to GITHUB_TOKEN, which cannot cross repositories).
      # GITHUB_REPO: https://github.com/Hiyori-API/HiyoriDB.git (or owner/repo)
      # MAL_CLIENT_ID, MAL_CLIENT_SECRET (if ingestion runs)

    steps:
      - name: Checkout HiyoriDB target repo (for push)
        uses: actions/checkout@v4
        with:
          repository: Hiyori-API/HiyoriDB
          token: ${{ secrets.HIYORI_DB_TOKEN || secrets.GITHUB_TOKEN }}
          path: hiyori-db-target
          fetch-depth: 1

      - name: Checkout hiyori-cli (this repo)
        uses: actions/checkout@v4
        path: hiyori-cli

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, mbstring, xml, curl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: hiyori-cli/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('hiyori-cli/composer.lock') }}

      - name: Install Dependencies (hiyori-cli)
        working-directory: hiyori-cli
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preflight (the release must have source data to combine)
        working-directory: hiyori-cli
        run: |
          php -r '
            $c = new MongoDB\Client(getenv("MONGODB_URL"));
            $db = $c->selectDatabase("hiyori");
            $rows = 0;
            foreach (["anilist", "anilist_manga"] as $t) {
              $n = $db->selectCollection($t)->countDocuments();
              echo "  $t: $n documents\n";
              $rows += $n;
            }
            if ($rows === 0) {
              fwrite(STDERR, "No source data in MongoDB. MONGODB_URL must point at a populated instance — the CI service database is empty.\n");
              exit(1);
            }
          '

      - name: Verify env & MongoDB
        working-directory: hiyori-cli
        run: |
          php -r "echo 'MONGODB_URL: ' . (getenv('MONGODB_URL') ?: 'MISSING') . PHP_EOL;"
          php -r "echo 'GITHUB_TOKEN: ' . (getenv('GITHUB_TOKEN') ? 'SET' : 'MISSING') . PHP_EOL;"
          php -r "echo 'GITHUB_REPO: ' . (getenv('GITHUB_REPO') ?: 'MISSING') . PHP_EOL;"
          php -r "new MongoDB\Client(getenv('MONGODB_URL'))->selectDatabase('admin')->command(['ping'=>1]); echo 'MongoDB OK' . PHP_EOL;"

      # The release chain lives in exactly one place: `php hiyori pipeline:release`
      # (src/Commands/PipelineCommand.php) owns the stage order -- migrate ->
      # combine anime -> combine manga -> hiyori-id --backfill -> combine:dupes
      # (the release gate) -> combine:dedupe -> release --verify -- asserts a
      # precondition before every stage and refuses to continue on a bad input.
      # This job runs that orchestrator; it does not spell the order out again.
      - name: Release pipeline (migrate, combine, release gate, publish)
        working-directory: hiyori-cli
        env:
          GH_TOKEN: ${{ secrets.HIYORI_DB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.HIYORI_DB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        run: |
          # Anime base = anilist, manga base = anilist_manga (the orchestrator's
          # combine stages), both with --passthrough, so the release holds one
          # document per ingested entry and no registry id is left without one.
          # The release stage takes repo/branch/tag; --verify is always on.
          php hiyori pipeline:release \
            --repo "$GITHUB_REPO" \
            --branch master \
            --tag "${GITHUB_REF_NAME:-data-$(date +%Y.%V)}"

      - name: Release gate (no duplicate identity keys)
        # The gate itself ran inside the pipeline: the `dupes` stage reports the
        # duplicate identity keys -- mal/al for organized, mal_manga/al_manga for
        # organized_manga -- and the `release` stage refuses to publish while
        # the gate fails (an empty collection is a failure too, because then
        # the check proves nothing). Franchise keys (k/cr/t/nf/...) are reported
        # but allowed. This step prints the verdict from the run record, so the
        # gate is still visible on its own in the job output.
        if: always()
        working-directory: hiyori-cli
        run: |
          php -r '
            $file = "storage/state/pipeline-release-latest.json";
            if (!is_file($file)) { echo "no pipeline run record at $file" . PHP_EOL; exit(0); }
            $record = json_decode((string) file_get_contents($file), true);
            $record = is_array($record) ? $record : [];
            foreach ((array) ($record["stages"] ?? []) as $stage) {
                $id = (string) ($stage["stage"] ?? "");
                if ($id !== "dupes" && $id !== "release") { continue; }
                printf("gate %-8s %-8s %s%s", $id, (string) ($stage["status"] ?? "?"), (string) ($stage["precondition"]["name"] ?? "-"), PHP_EOL);
            }
            printf("pipeline status: %s (failed stage: %s)%s", (string) ($record["status"] ?? "?"), (string) ($record["failed_stage"] ?? "none"), PHP_EOL);
          '

      # Optional F1 gate (needs a labelled hold-out pairs file; run manually):
      #   php hiyori ml:export-pairs --holdout 30
      #   php hiyori ml:train --in storage/ml/pairs-*-train.jsonl
      #   php hiyori combine:benchmark --in storage/ml/pairs-*-holdout.jsonl --margin 2 --strict

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Published to HiyoriDB" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
