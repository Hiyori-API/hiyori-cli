services:
  mongodb:
    image: mongo:7.0
    container_name: hiyori-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hiyori
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hiyori-network

  # One-shot CLI runner. `docker compose up` does not start it; invoke it with
  #   docker compose --profile cli run --rm hiyori ingest anilist
  # It must not restart: the process is a command that exits, and
  # `restart: unless-stopped` relaunches it on any exit, including success.
  hiyori:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiyori-cli
    profiles: ["cli"]
    restart: "no"
    environment:
      - APP_ENV=prod
      - APP_DEBUG=false
      - APP_VERSION=1.0.0
      - MONGODB_URL=mongodb://mongodb:27017
      - MAL_CLIENT_ID=${MAL_CLIENT_ID}
      - MAL_CLIENT_SECRET=${MAL_CLIENT_SECRET}
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60
      - HTTP_CACHE=true
      - HTTP_CACHE_PATH=/app/storage/cache
      - HTTP_CACHE_TTL=3600
      - PROGRESSBAR_FORMAT="%current%/%max% [%bar%] %percent:3s%% | ETA:%estimated:-6s% MEM:%memory:6s%"
      - PROGRESSBAR_REDRAW_FREQ=1
    volumes:
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hiyori-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiyori-dashboard
    restart: unless-stopped
    command: ["dashboard:serve", "--host=0.0.0.0", "--port=8080", "--no-open"]
    environment:
      - APP_DEBUG=false
      - APP_VERSION=1.0.0
      - MONGODB_URL=mongodb://mongodb:27017
      - HTTP_CACHE=true
      - HTTP_CACHE_PATH=/app/storage/cache
      - HTTP_CACHE_TTL=3600
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hiyori-network

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: hiyori-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - dashboard
    networks:
      - hiyori-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: hiyori-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - hiyori-network
    profiles:
      - monitoring

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  hiyori-network:
    driver: bridge
