query ($page: Int, $type: MediaType = ANIME, $sort: [MediaSort] = [ID], $seasonYear: Int) {
    Page(page: $page, perPage: 50) {
        pageInfo {
            total
            perPage
            currentPage
            lastPage
            hasNextPage
        }
        media(type: $type, sort: $sort, seasonYear: $seasonYear) {
            id
            idMal
            siteUrl
            coverImage {
                extraLarge
                large
                medium
            }
            title {
                romaji
                english
                native
            }
            synonyms
            format
            status
            episodes
            externalLinks {
                id
                url
                type
            }
            streamingEpisodes {
                title
                url
                site
            }
            startDate {
                year
                month
                day
            }
            endDate {
                year
                month
                day
            }
            seasonYear
            season
            source
            genres
            tags {
                id
                name
            }
        }
    }
}
