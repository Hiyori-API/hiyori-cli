global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hiyori'
    metrics_path: /metrics
    static_configs:
      # The dashboard is the only process that serves HTTP.
      - targets: ['dashboard:8080']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
